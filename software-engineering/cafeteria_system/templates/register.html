{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-5">
    <div class="card shadow-sm border-0 rounded-3">
      <div class="card-body p-4">
        <h3 class="card-title text-center fw-bold mb-4">Student Registration</h3>
        <form method="POST">
          <div class="mb-3">
            <label class="form-label fw-semibold">Username</label>
            <input type="text" name="username" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Email Address</label>
            <input type="email" name="email" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Student ID</label>
            <input type="text" name="student_id" class="form-control" placeholder="e.g. STU-12345" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Password</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-success w-100 py-2">Create Student Account</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
