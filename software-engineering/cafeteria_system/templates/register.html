{% extends "base.html" %}

{% block title %}Student Registration{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
  <div class="col-md-8 col-lg-6">
    <div class="card border-0 shadow-lg">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="bg-warning text-dark rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 60px; height: 60px;">
            <i class="bi bi-mortarboard-fill fs-2"></i>
          </div>
          <h3 class="fw-bold">Student Registration</h3>
          <p class="text-muted small">Create an account to browse Bahria Bites and pre-order meals</p>
        </div>

        <form method="POST" action="{{ url_for('register') }}">
          <div class="row g-3">
            <div class="col-md-6">
              <label for="username" class="form-label fw-semibold">Username</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control" id="username" name="username" placeholder="e.g. jdoe" required autofocus>
              </div>
            </div>

            <div class="col-md-6">
              <label for="student_id" class="form-label fw-semibold">Student ID</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-card-text"></i></span>
                <input type="text" class="form-control" id="student_id" name="student_id" placeholder="e.g. STU-2024-042" required>
              </div>
            </div>

            <div class="col-12">
              <label for="email" class="form-label fw-semibold">University Email</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="email" name="email" placeholder="e.g. jdoe@student.edu" required>
              </div>
            </div>

            <div class="col-md-6">
              <label for="password" class="form-label fw-semibold">Password</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="password" name="password" minlength="6" placeholder="At least 6 characters" required>
              </div>
            </div>

            <div class="col-md-6">
              <label for="confirm_password" class="form-label fw-semibold">Confirm Password</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                <input type="password" class="form-control" id="confirm_password" name="confirm_password" minlength="6" placeholder="Repeat password" required>
              </div>
            </div>

            <div class="col-12 mt-4">
              <button type="submit" class="btn btn-warning text-dark fw-bold w-100 py-2">
                <i class="bi bi-person-plus-fill me-1"></i> Complete Registration
              </button>
            </div>
          </div>
        </form>

        <div class="text-center mt-4 pt-2 border-top border-secondary border-opacity-25">
          <p class="small text-muted mb-0">Already registered? 
            <a href="{{ url_for('login') }}" class="text-primary fw-semibold text-decoration-none">Sign In Here</a>
          </p>
        </div>

      </div>
    </div>
  </div>
</div>
{% endblock %}
