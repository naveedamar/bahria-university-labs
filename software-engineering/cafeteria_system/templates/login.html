{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5">
    <div class="card shadow-sm border-0 rounded-3">
      <div class="card-body p-4">
        <h3 class="card-title text-center fw-bold mb-4">Sign In</h3>
        <form method="POST">
          <div class="mb-3">
            <label class="form-label fw-semibold">Username</label>
            <input type="text" name="username" class="form-control" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Password</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2">Log In</button>
        </form>
        <hr class="my-4">
        <div class="small text-muted text-center">
          <strong>Demo Logins (Password: password123)</strong><br>
          Student: <code>student1</code> | Staff: <code>staff1</code> | Manager: <code>manager1</code>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
