{% extends "base.html" %}

{% block title %}Log In{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
  <div class="col-md-7 col-lg-5">
    <div class="card border-0 shadow-lg">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 60px; height: 60px;">
            <i class="bi bi-person-fill-lock fs-2"></i>
          </div>
          <h3 class="fw-bold">Sign In</h3>
          <p class="text-muted small">Access the Bahria Bites pre-ordering platform</p>
        </div>

        <form method="POST" action="{{ url_for('login', next=request.args.get('next')) }}">
          <div class="mb-3">
            <label for="username" class="form-label fw-semibold">Username or Email</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person"></i></span>
              <input type="text" class="form-control" id="username" name="username" placeholder="e.g. student1" required autofocus>
            </div>
          </div>

          <div class="mb-4">
            <label for="password" class="form-label fw-semibold">Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
            <i class="bi bi-box-arrow-in-right me-1"></i> Log In
          </button>
        </form>

        <div class="text-center mt-4 pt-2 border-top border-secondary border-opacity-25">
          <p class="small text-muted mb-0">Don't have an account yet? 
            <a href="{{ url_for('register') }}" class="text-primary fw-semibold text-decoration-none">Register as Student</a>
          </p>
        </div>

      </div>
    </div>
  </div>
</div>
{% endblock %}
