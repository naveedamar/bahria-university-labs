{% extends "base.html" %}

{% block title %}Edit Menu Item - {{ item.name }}{% endblock %}

{% block content %}
<div class="row justify-content-center py-3">
  <div class="col-lg-8">
    <div class="card border-0 shadow-sm">
      <div class="card-header py-3 d-flex justify-content-between align-items-center border-bottom border-secondary border-opacity-25">
        <h5 class="mb-0 fw-bold"><i class="bi bi-pencil-square text-primary me-2"></i>Edit Dish / Item</h5>
        <a href="{{ url_for('manager_dashboard') }}" class="btn btn-sm btn-outline-secondary">
          <i class="bi bi-arrow-left me-1"></i> Back to Dashboard
        </a>
      </div>

      <div class="card-body p-4">
        <form method="POST" action="{{ url_for('manager_edit_menu_item', item_id=item.id) }}">
          <div class="row g-3">
            <div class="col-md-8">
              <label for="name" class="form-label fw-semibold">Item Name *</label>
              <input type="text" class="form-control" id="name" name="name" value="{{ item.name }}" required>
            </div>
            <div class="col-md-4">
              <label for="category" class="form-label fw-semibold">Category *</label>
              <select class="form-select" id="category" name="category" required>
                {% for cat in categories %}
                  <option value="{{ cat }}" {% if item.category == cat %}selected{% endif %}>{{ cat }}</option>
                {% endfor %}
              </select>
            </div>

            <div class="col-md-6">
              <label for="price" class="form-label fw-semibold">Price (Rs.) *</label>
              <input type="number" step="0.5" min="0" class="form-control" id="price" name="price" value="{{ "%.2f"|format(item.price) }}" required>
            </div>
            <div class="col-md-6">
              <label for="image_url" class="form-label fw-semibold">Image URL (Optional)</label>
              <input type="url" class="form-control" id="image_url" name="image_url" value="{{ item.image_url or '' }}" placeholder="https://...">
            </div>

            <div class="col-12">
              <label for="description" class="form-label fw-semibold">Description *</label>
              <textarea class="form-control" id="description" name="description" rows="4" required>{{ item.description }}</textarea>
            </div>

            <div class="col-12">
              <div class="form-check form-switch mt-2">
                <input class="form-check-input" type="checkbox" id="available" name="available" {% if item.available %}checked{% endif %}>
                <label class="form-check-label fw-semibold" for="available">
                  Available for Ordering (Students can add this to their cart)
                </label>
              </div>
            </div>

            <div class="col-12 pt-3 border-top border-secondary border-opacity-25 d-flex gap-2">
              <button type="submit" class="btn btn-primary px-4 fw-semibold">
                <i class="bi bi-check2 me-1"></i> Save Changes
              </button>
              <a href="{{ url_for('manager_dashboard') }}" class="btn btn-outline-secondary px-4">Cancel</a>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
